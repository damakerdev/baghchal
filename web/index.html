<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBird - Play Baghchal with Bot</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🐦‍⬛ Blackbird</h1>
            <p>A Baghchal engine in the making</p>
        </header>
        <div class="game-wrapper">
            <div id="myBaghchalBoard"></div> 

            <div class="controls-row">
                <button id="restartBtn" class="btn btn-primary">New Game</button>
                          
                <div class="api-config">
                    <input type="url" name="botApiUrl" id="botApiUrl" placeholder="Bot API URL..." />
                    <button id="saveApiBtn" class="btn btn-secondary">Connect</button>
                </div>
            </div>
        </div>
        <div id="apiStatus" class="status-indicator">Status: Idle</div>

        <footer class="credits">
                Made with ❤️ by <span class="author">damakerdev</span>
        </footer>
    </div>

    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalMessage">You won!</p>
            <button id="modalCloseBtn" class="btn primary-btn">Okay</button>
        </div>
    </div>


    <script type="module" src="../lib/baghchal.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
